<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="chatBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="bubbleMe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#chatBg)"/>

  <!-- Left Sidebar (Rooms & Users) -->
  <rect x="0" y="0" width="220" height="450" fill="#0f0e26" stroke="#312e81" stroke-width="1"/>
  <text x="20" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="bold"># DEV CHANNELS</text>
  
  <rect x="12" y="55" width="196" height="32" rx="6" fill="#312e81"/>
  <text x="26" y="76" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold"># general-engineering</text>
  <circle cx="190" cy="71" r="4" fill="#10b981"/>

  <rect x="12" y="95" width="196" height="32" rx="6" fill="transparent"/>
  <text x="26" y="116" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="12"># react-state-sync</text>

  <rect x="12" y="135" width="196" height="32" rx="6" fill="transparent"/>
  <text x="26" y="156" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="12"># socket-clustering</text>

  <text x="20" y="210" fill="#6366f1" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">ONLINE TEAM (5)</text>
  <circle cx="26" cy="235" r="4" fill="#10b981"/>
  <text x="38" y="239" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="12">Israel Teshale (You)</text>
  <circle cx="26" cy="265" r="4" fill="#10b981"/>
  <text x="38" y="269" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="12">Sarah (Lead QA)</text>
  <circle cx="26" cy="295" r="4" fill="#10b981"/>
  <text x="38" y="299" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="12">David (Backend Eng)</text>

  <!-- Chat Header -->
  <rect x="220" y="0" width="580" height="50" fill="#1e1b4b" stroke="#312e81" stroke-width="1"/>
  <text x="245" y="31" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="bold"># general-engineering &bull; WebSocket Connected</text>
  <rect x="690" y="12" width="90" height="26" rx="13" fill="#10b981" opacity="0.2"/>
  <circle cx="705" cy="25" r="4" fill="#10b981"/>
  <text x="716" y="29" fill="#10b981" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Live (4ms)</text>

  <!-- Message 1 (Incoming) -->
  <circle cx="255" cy="95" r="14" fill="#6366f1"/>
  <text x="250" y="100" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">S</text>
  <rect x="280" y="80" width="360" height="44" rx="10" fill="#2e2b6b"/>
  <text x="296" y="106" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="12.5">Just merged the real-time presence patch!</text>

  <!-- Message 2 (Outgoing) -->
  <rect x="420" y="145" width="340" height="44" rx="10" fill="url(#bubbleMe)"/>
  <text x="436" y="171" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12.5">Awesome! Socket broadcast latency is under 5ms.</text>

  <!-- Message 3 (Incoming) -->
  <circle cx="255" cy="220" r="14" fill="#ec4899"/>
  <text x="250" y="225" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">D</text>
  <rect x="280" y="205" width="410" height="58" rx="10" fill="#2e2b6b"/>
  <text x="296" y="230" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="12.5">Room persistence is syncing smoothly with MySQL.</text>
  <text x="296" y="248" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="11.5">All unit tests passing (100% test coverage)</text>

  <!-- Input Field -->
  <rect x="240" y="375" width="540" height="50" rx="12" fill="#18153d" stroke="#4338ca" stroke-width="1"/>
  <text x="260" y="405" fill="#818cf8" font-family="system-ui, sans-serif" font-size="13">Type a real-time message...</text>
  <circle cx="750" cy="400" r="16" fill="#6366f1"/>
  <path d="M 744 400 L 754 395 L 750 405 Z" fill="#ffffff"/>
</svg>

