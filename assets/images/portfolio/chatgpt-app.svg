<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="bubbleAI" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#1f1f23"/>
    </linearGradient>
    <linearGradient id="accentG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgG)"/>

  <!-- Left Sidebar (Collapsible) -->
  <rect x="0" y="0" width="180" height="450" fill="#141416" stroke="#27272a" stroke-width="1"/>
  <rect x="15" y="20" width="150" height="34" rx="8" fill="#27272a"/>
  <text x="32" y="42" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="12" font-weight="600">+ New Chat</text>
  
  <text x="18" y="85" fill="#71717a" font-family="system-ui, sans-serif" font-size="11" font-weight="600">RECENT CHATS</text>
  <rect x="15" y="100" width="150" height="28" rx="6" fill="#1f1f23"/>
  <text x="25" y="118" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="11">RAG Architecture Q&amp;A</text>
  <rect x="15" y="136" width="150" height="28" rx="6" fill="transparent"/>
  <text x="25" y="154" fill="#71717a" font-family="system-ui, sans-serif" font-size="11">React Hook Best Practices</text>
  <rect x="15" y="172" width="150" height="28" rx="6" fill="transparent"/>
  <text x="25" y="190" fill="#71717a" font-family="system-ui, sans-serif" font-size="11">Express Middleware Setup</text>

  <!-- Main Chat Area Header -->
  <rect x="180" y="0" width="620" height="50" fill="#18181b" stroke="#27272a" stroke-width="1"/>
  <circle cx="210" cy="25" r="12" fill="url(#accentG)"/>
  <text x="204" y="30" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">AI</text>
  <text x="232" y="30" fill="#f4f4f5" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">ChatGPT Clone &bull; GPT-4o</text>

  <!-- User Message Bubble -->
  <rect x="420" y="80" width="340" height="52" rx="14" fill="#3b82f6"/>
  <text x="438" y="102" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13">How does Retrieval-Augmented Generation</text>
  <text x="438" y="120" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13">(RAG) enhance community forums?</text>

  <!-- AI Response Bubble -->
  <circle cx="215" cy="170" r="14" fill="url(#accentG)"/>
  <text x="209" y="175" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">AI</text>

  <rect x="240" y="155" width="520" height="150" rx="14" fill="url(#bubbleAI)" stroke="#3f3f46" stroke-width="1"/>
  <text x="260" y="185" fill="#f4f4f5" font-family="system-ui, sans-serif" font-size="13" font-weight="600">RAG combines search retrieval with generative AI:</text>
  <text x="260" y="212" fill="#d4d4d8" font-family="system-ui, sans-serif" font-size="12.5">&bull; Vectorizes existing forum answers and developer documentation.</text>
  <text x="260" y="236" fill="#d4d4d8" font-family="system-ui, sans-serif" font-size="12.5">&bull; Performs semantic search against user questions before generating answers.</text>
  <text x="260" y="260" fill="#d4d4d8" font-family="system-ui, sans-serif" font-size="12.5">&bull; Drastically eliminates hallucinations with verified community source citations.</text>
  <text x="260" y="284" fill="#10b981" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold">&bull; Real-time stream response &bull; Fast semantic retrieval (38ms)</text>

  <!-- Prompt Input Bar at Bottom -->
  <rect x="220" y="375" width="540" height="50" rx="14" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
  <text x="245" y="405" fill="#71717a" font-family="system-ui, sans-serif" font-size="13">Ask anything or type a prompt...</text>
  <circle cx="735" cy="400" r="16" fill="url(#accentG)"/>
  <path d="M 730 405 L 735 395 L 740 405 Z" fill="#ffffff"/>
</svg>

