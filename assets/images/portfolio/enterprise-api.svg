<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="apiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cyanBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#apiBg)"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="800" height="46" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="25" cy="23" r="6" fill="#ef4444"/>
  <circle cx="45" cy="23" r="6" fill="#f59e0b"/>
  <circle cx="65" cy="23" r="6" fill="#10b981"/>
  <text x="95" y="28" fill="#94a3b8" font-family="monospace" font-size="12">POSTMAN / REST API SPEC &bull; v2.4.0</text>
  <rect x="680" y="10" width="100" height="26" rx="6" fill="#10b981"/>
  <text x="696" y="27" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">200 OK &bull; 24ms</text>

  <!-- Left Sidebar (Endpoints) -->
  <rect x="0" y="46" width="220" height="404" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="18" y="75" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">AUTH &amp; SECURITY</text>
  <rect x="15" y="88" width="190" height="26" rx="4" fill="#1e293b"/>
  <rect x="22" y="93" width="36" height="16" rx="3" fill="#3b82f6"/>
  <text x="26" y="105" fill="#ffffff" font-family="monospace" font-size="9" font-weight="bold">POST</text>
  <text x="64" y="105" fill="#e2e8f0" font-family="monospace" font-size="10">/api/v1/auth/login</text>

  <rect x="15" y="120" width="190" height="26" rx="4" fill="transparent"/>
  <rect x="22" y="125" width="36" height="16" rx="3" fill="#3b82f6"/>
  <text x="26" y="137" fill="#ffffff" font-family="monospace" font-size="9" font-weight="bold">POST</text>
  <text x="64" y="137" fill="#94a3b8" font-family="monospace" font-size="10">/api/v1/auth/register</text>

  <text x="18" y="170" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">TASKS &amp; WORKFLOW</text>
  <rect x="15" y="182" width="190" height="26" rx="4" fill="#1e293b"/>
  <rect x="22" y="187" width="30" height="16" rx="3" fill="#10b981"/>
  <text x="26" y="199" fill="#ffffff" font-family="monospace" font-size="9" font-weight="bold">GET</text>
  <text x="58" y="199" fill="#e2e8f0" font-family="monospace" font-size="10">/api/v1/tasks?status=active</text>

  <rect x="15" y="214" width="190" height="26" rx="4" fill="transparent"/>
  <rect x="22" y="219" width="30" height="16" rx="3" fill="#f59e0b"/>
  <text x="26" y="231" fill="#ffffff" font-family="monospace" font-size="9" font-weight="bold">PUT</text>
  <text x="58" y="231" fill="#94a3b8" font-family="monospace" font-size="10">/api/v1/tasks/:id</text>

  <rect x="15" y="246" width="190" height="26" rx="4" fill="transparent"/>
  <rect x="22" y="251" width="30" height="16" rx="3" fill="#ef4444"/>
  <text x="25" y="263" fill="#ffffff" font-family="monospace" font-size="9" font-weight="bold">DEL</text>
  <text x="58" y="263" fill="#94a3b8" font-family="monospace" font-size="10">/api/v1/tasks/:id</text>

  <!-- Right Response Area (JSON Code block) -->
  <rect x="240" y="65" width="540" height="360" rx="8" fill="#020617" stroke="#1e293b" stroke-width="1"/>
  <text x="260" y="95" fill="#94a3b8" font-family="monospace" font-size="12">Response JSON Payload (JWT Authenticated):</text>
  
  <text x="260" y="125" fill="#f8fafc" font-family="monospace" font-size="12">{</text>
  <text x="280" y="148" fill="#38bdf8" font-family="monospace" font-size="12">"status"<tspan fill="#f8fafc">: </tspan><tspan fill="#4ade80">"success"</tspan><tspan fill="#f8fafc">,</tspan></text>
  <text x="280" y="171" fill="#38bdf8" font-family="monospace" font-size="12">"token"<tspan fill="#f8fafc">: </tspan><tspan fill="#facc15">"eyJhbGciOiJIUzI1NiIsIn..."</tspan><tspan fill="#f8fafc">,</tspan></text>
  <text x="280" y="194" fill="#38bdf8" font-family="monospace" font-size="12">"user"<tspan fill="#f8fafc">: {</tspan></text>
  <text x="300" y="217" fill="#38bdf8" font-family="monospace" font-size="12">"id"<tspan fill="#f8fafc">: </tspan><tspan fill="#fb923c">1042</tspan><tspan fill="#f8fafc">,</tspan></text>
  <text x="300" y="240" fill="#38bdf8" font-family="monospace" font-size="12">"name"<tspan fill="#f8fafc">: </tspan><tspan fill="#4ade80">"Israel Teshale"</tspan><tspan fill="#f8fafc">,</tspan></text>
  <text x="300" y="263" fill="#38bdf8" font-family="monospace" font-size="12">"role"<tspan fill="#f8fafc">: </tspan><tspan fill="#4ade80">"Lead Developer"</tspan><tspan fill="#f8fafc">,</tspan></text>
  <text x="300" y="286" fill="#38bdf8" font-family="monospace" font-size="12">"permissions"<tspan fill="#f8fafc">: [</tspan><tspan fill="#4ade80">"read"</tspan><tspan fill="#f8fafc">, </tspan><tspan fill="#4ade80">"write"</tspan><tspan fill="#f8fafc">, </tspan><tspan fill="#4ade80">"admin"</tspan><tspan fill="#f8fafc">]</tspan></text>
  <text x="280" y="309" fill="#f8fafc" font-family="monospace" font-size="12">},</text>
  <text x="280" y="332" fill="#38bdf8" font-family="monospace" font-size="12">"dbLatency"<tspan fill="#f8fafc">: </tspan><tspan fill="#4ade80">"3.2ms (MySQL Connection Pool)"</tspan></text>
  <text x="260" y="355" fill="#f8fafc" font-family="monospace" font-size="12">}</text>
</svg>

