<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="40%" stop-color="#101726"/>
      <stop offset="100%" stop-color="#080c14"/>
    </linearGradient>

    <!-- Glowing Accent 1 (Amber Gold) -->
    <radialGradient id="glowAmber" cx="80%" cy="25%" r="50%">
      <stop offset="0%" stop-color="#F2BD3E" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#F2BD3E" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#F2BD3E" stop-opacity="0"/>
    </radialGradient>

    <!-- Glowing Accent 2 (Cyan Blue) -->
    <radialGradient id="glowBlue" cx="20%" cy="75%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#1d4ed8" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Developer Grid Pattern -->
    <pattern id="devGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255, 255, 255, 0.035)" stroke-width="1"/>
      <circle cx="60" cy="0" r="1.5" fill="rgba(242, 189, 62, 0.2)"/>
    </pattern>

    <!-- Subtle Dot Pattern -->
    <pattern id="dotGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(255, 255, 255, 0.04)"/>
    </pattern>
  </defs>

  <!-- Deep Slate Tech Background -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <!-- Ambient Glows -->
  <rect width="1920" height="1080" fill="url(#glowAmber)"/>
  <rect width="1920" height="1080" fill="url(#glowBlue)"/>

  <!-- Developer Grid Overlay -->
  <rect width="1920" height="1080" fill="url(#devGrid)"/>
  <rect width="1920" height="1080" fill="url(#dotGrid)"/>

  <!-- Futuristic Geometric Circuit / Connection Lines -->
  <g stroke="rgba(242, 189, 62, 0.15)" stroke-width="1.5" fill="none" stroke-linecap="round">
    <path d="M 1200 150 L 1400 150 L 1550 300 L 1750 300" />
    <path d="M 1400 150 L 1450 100 L 1650 100" />
    <circle cx="1200" cy="150" r="4" fill="#F2BD3E" opacity="0.6"/>
    <circle cx="1750" cy="300" r="4" fill="#F2BD3E" opacity="0.6"/>
    <circle cx="1650" cy="100" r="3" fill="#F2BD3E" opacity="0.5"/>

    <path d="M 1100 850 L 1250 850 L 1380 720 L 1600 720" stroke="rgba(56, 189, 248, 0.15)"/>
    <circle cx="1100" cy="850" r="3" fill="#38bdf8" opacity="0.5"/>
    <circle cx="1600" cy="720" r="4" fill="#38bdf8" opacity="0.6"/>
  </g>

  <!-- Floating Tech Badges / Hexagons (Right Hero Space) -->
  <g opacity="0.25">
    <polygon points="1520,380 1570,350 1620,380 1620,440 1570,470 1520,440" fill="none" stroke="#F2BD3E" stroke-width="1.5"/>
    <polygon points="1420,520 1460,495 1500,520 1500,570 1460,595 1420,570" fill="none" stroke="#38bdf8" stroke-width="1.2"/>
    <polygon points="1650,560 1690,535 1730,560 1730,610 1690,635 1650,610" fill="none" stroke="#F2BD3E" stroke-width="1.2"/>
  </g>

  <!-- Subtle Perspective Floor / Horizon Grid -->
  <line x1="0" y1="1079" x2="1920" y2="1079" stroke="rgba(242, 189, 62, 0.2)" stroke-width="1"/>
</svg>
